name: Point Pages at v3

on:
  push:
    branches:
      - preview/creditlabz-v3-next-pass

permissions:
  contents: read
  pages: write

jobs:
  point:
    runs-on: ubuntu-latest
    steps:
      - name: Set Pages source to this branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo '{"build_type":"legacy","source":{"branch":"preview/creditlabz-v3-next-pass","path":"/"}}' \
            | gh api --method PUT repos/jonbeatz/creditlabz-ravyn-preview/pages --input -
          gh api repos/jonbeatz/creditlabz-ravyn-preview/pages --jq '{branch:.source.branch,path:.source.path,status:.status}'
          gh api --method POST repos/jonbeatz/creditlabz-ravyn-preview/pages/builds
